azs:
- name: z1
  cloud_properties:
    availability_zone: test-z1

vm_types:
- name: wireguard
  cloud_properties:
    instance_type: Standard_B2s
- name: default
  cloud_properties:
    instance_type: Standard_D2s_v3

vm_extensions:
- name: test-set
  cloud_properties:
    availability_set: availability-set-for-azure

networks:
- name: wireguard
  type: manual
  subnets:
  - range: 10.99.0.0/16
    gateway: 10.99.0.1
    azs: [z1]
    dns:
    - test-dns
    reserved: [ 10.99.0.1 - 10.99.0.15 ]
    static: [ 10.99.0.16 - 10.99.0.30 ]
    cloud_properties:
      subnet: test-subnet
- name: vip
  type: vip

compilation:
  workers: 5
  reuse_compilation_vms: true
  az: z1
  vm_type: default
  network: default
