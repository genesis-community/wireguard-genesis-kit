exodus:
  bosh: peers
  endpoint: ""
  features: ""
  iaas: aws
  ip: 10.99.0.16
  is_director: false
  port: 51820
  public_key: <!{meta.vault}/server:public!>
  scale: null
  services: null
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - name: bpm
    release: bpm
  - name: wireguard
    properties:
      wireguard:
        addresses:
        - 10.20.30.1/24
        forwarding:
          ipv4: true
        interface: wg0
        listen_port: 51820
        peers:
        - allowed_ips:
          - 10.20.30.2/32
          name: alice
          preshared_key: <!peer alice:psk!>
          public_key: <!peer alice:public!>
        - allowed_ips:
          - 10.20.30.3/32
          - 192.168.77.0/24
          name: bob
          preshared_key: <!peer bob:psk!>
          public_key: <!peer bob:public!>
        private_key: <!{meta.vault}/server:private!>
        public_key: <!{meta.vault}/server:public!>
    release: wireguard
  - name: iptables
    properties:
      iptables:
        filter:
          FORWARD:
          - -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
        nat:
          POSTROUTING:
          - -s 10.20.30.0/24 -d 0/0 -j MASQUERADE
    release: networking
  - name: smoke-tests
    properties:
      wireguard:
        interface: wg0
        listen_port: 51820
    release: wireguard
  name: wireguard
  networks:
  - name: wireguard
    static_ips:
    - 10.99.0.16
  stemcell: default
  vm_type: wireguard
name: peers-wireguard
releases:
- name: wireguard
  version: 0.1.0
- name: bpm
  sha1: sha256:51f2eab4b59939db733beb8f7905e461a732cc29d85e54f151f576cd5bf0c414
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.22
  version: 1.4.22
- name: networking
  sha1: 9b5f9d27917c3754e492470ac6c9af80d62963db
  url: http://bosh.io/d/github.com/cloudfoundry/networking-release?v=9
  version: 9
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest
update:
  canaries: 1
  canary_watch_time: 5000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 5000-120000
